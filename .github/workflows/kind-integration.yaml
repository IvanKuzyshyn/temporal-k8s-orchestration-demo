name: Kind integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: ./.github/actions/setup-mise
      - name: Cumulative Go, chart, complete graph, strict schemas and Compose configuration
        run: mise run validate
      - run: mise run cluster:create
      - run: mise run infra:install
      - run: mise run images:load
      - run: mise run apps:deploy-static
      - run: mise run test:kind-baseline
      - run: mise run test:kind-persistence
      - name: Scoped secret-free failure diagnostics
        if: failure()
        run: mise run kind:diagnostics
      - name: Always delete ONLY owned temporal-demo cluster and its local PVC
        if: always()
        run: mise run cluster:delete
