name: Kind integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: ./.github/actions/setup-mise
      - name: Full demo, scale-to-zero, idempotency and stop/resume
        run: mise run test:integration
      - name: Cleanup verified owned cluster after cancellation
        if: always()
        shell: bash
        run: |
          if [[ -s .local/lifecycle/node-id && ! -e .local/lifecycle.lock ]]; then
            mise run destroy
          fi
