name: Compose

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: temporal-demo-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: ./.github/actions/setup-mise
      - name: Cumulative validation
        run: mise run validate
      - name: Build both application images
        run: mise run images:build
      - name: Start real PostgreSQL-backed stack
        run: mise run compose:up
      - name: Diamond and durable replay
        run: mise run compose:smoke
      - name: Isolated persistence and reset
        run: mise run compose:persistence
      - name: Always remove only this job's projects and volumes
        if: always()
        run: mise run compose:cleanup
