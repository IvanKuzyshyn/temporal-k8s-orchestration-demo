min_version = "2026.10.17"

[tools]
go = "1.27.3"
kind = "0.33.0"
helm = "4.3.1"
kubectl = "1.35.8"
"aqua:yannh/kubeconform" = "0.8.0"

[env]
GOTOOLCHAIN = "local"

[tasks.test]
description = "Run all Go tests with the race detector"
run = "go test -race ./..."

[tasks."test:manifests"]
description = "Test complete rendered graph extraction and real CLI fixture exit/output contracts"
run = "go test -race ./internal/manifest ./cmd/validate-graph"

[tasks.validate]
description = "Check Go/race/vet, Helm/full graph/strict schemas and Compose config (same command in CI)"
run = '''
set -eu
files=$(gofmt -l $(git ls-files --cached --others --exclude-standard '*.go'))
if [ -n "$files" ]; then
  printf 'Go files need gofmt:\n%s\n' "$files"
  exit 1
fi
go test -race ./...
go vet ./...
bash -n scripts/*.sh
mise run test:manifests
mise run validate:manifests
bash scripts/compose.sh config
'''

[tasks."cluster:create"]
run = "bash scripts/cluster-create.sh"

[tasks."cluster:delete"]
description = "DESTRUCTIVE: delete ONLY owned temporal-demo cluster and its PVC history"
run = "bash scripts/cluster-delete.sh"

[tasks."infra:install"]
run = "bash scripts/infrastructure-install.sh"

[tasks."images:load"]
run = "bash scripts/images-load.sh"

[tasks."apps:deploy-static"]
run = "bash scripts/apps-deploy.sh"

[tasks."validate:manifests"]
run = "bash scripts/validate-manifests.sh"

[tasks."api:forward"]
run = "bash scripts/kind-forward.sh api"

[tasks."ui:forward"]
run = "bash scripts/kind-forward.sh ui"

[tasks."test:kind-baseline"]
run = "bash scripts/kind-integration.sh baseline"

[tasks."test:kind-persistence"]
run = "bash scripts/kind-integration.sh persistence"

[tasks."kind:diagnostics"]
run = "bash scripts/kind-diagnostics.sh"

[tasks."images:build"]
description = "Build both app images with a clean Git SHA or unique dirty local tag"
run = "bash scripts/compose.sh build"

[tasks."compose:up"]
description = "Build and start the PostgreSQL-backed local demo, waiting for readiness"
run = "bash scripts/compose.sh up"

[tasks."compose:smoke"]
description = "Assert a real diamond, durable replay and zero-body HTTP contract"
run = "bash scripts/compose-smoke.sh"

[tasks."compose:persistence"]
description = "Verify restarts, replacement, schema rerun and isolated destructive reset"
run = "bash scripts/compose-persistence.sh"

[tasks."compose:down"]
description = "Stop this project, preserving its PostgreSQL history volume"
run = "bash scripts/compose.sh down"

[tasks."compose:reset"]
description = "DESTRUCTIVE: remove this project's history (requires RESET_CONFIRM=1)"
run = "bash scripts/compose.sh reset"

[tasks."compose:cleanup"]
description = "CI job-scoped cleanup; aggregate discovery/reset failures without skipping normal cleanup"
run = "bash scripts/compose-cleanup.sh"

[tasks."compose:config"]
description = "Validate Compose configuration without rendering credentials"
run = "bash scripts/compose.sh config"
