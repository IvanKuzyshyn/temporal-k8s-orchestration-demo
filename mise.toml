min_version = "2026.10.17"

[tools]
go = "1.27.3"
kind = "0.33.0"
helm = "4.3.1"
kubectl = "1.35.8"
kyverno = "1.19.2"

[env]
GOTOOLCHAIN = "local"

[tasks.up]
description = "Create/resume the full local Kubernetes demo and print ready API/UI URLs"
run = "bash scripts/local.sh up"

[tasks.down]
description = "Stop only the owned demo node and tunnels; retain all cluster data"
run = "bash scripts/local.sh down"

[tasks.destroy]
description = "DESTRUCTIVE: delete the owned demo cluster and all local workflow history"
run = "bash scripts/local.sh destroy"

[tasks.test]
run = "go test -race -count=1 ./..."

[tasks."test:integration"]
description = "Test the full lifecycle on a new disposable cluster; refuses existing demo resources"
run = "bash scripts/test-demo.sh"

[tasks.validate]
run = '''
set -eu
files=$(gofmt -l $(git ls-files --cached --others --exclude-standard '*.go'))
if [ -n "$files" ]; then printf 'Go files need gofmt:\n%s\n' "$files"; exit 1; fi
# External Helm/shell/policy inputs must be exercised even with a warm Go cache.
go test -race -count=1 ./...
go vet ./...
for script in scripts/*.sh; do bash -n "$script"; done
bash scripts/validate-manifests.sh
'''
