min_version = "2026.10.17"

[tools]
go = "1.27.3"
kind = "0.33.0"
helm = "4.3.1"
kubectl = "1.35.8"
kyverno = "1.19.2"

[env]
GOTOOLCHAIN = "local"

[tasks.up]
description = "Create/resume the full local Kubernetes demo and print ready API/UI URLs"
run = "bash scripts/local.sh up"

[tasks.down]
description = "Stop only the owned demo node and tunnels; retain all cluster data"
run = "bash scripts/local.sh down"

[tasks.destroy]
description = "DESTRUCTIVE: delete the owned demo cluster and all local workflow history"
run = "bash scripts/local.sh destroy"

[tasks.test]
run = "go test -race ./..."

[tasks."test:integration"]
description = "Test the full lifecycle on a new disposable cluster; refuses existing demo resources"
run = "bash scripts/test-demo.sh"

[tasks.validate]
run = '''
set -eu
files=$(gofmt -l $(git ls-files --cached --others --exclude-standard '*.go'))
if [ -n "$files" ]; then printf 'Go files need gofmt:\n%s\n' "$files"; exit 1; fi
go test -race ./...
go vet ./...
for script in scripts/*.sh; do bash -n "$script"; done
bash scripts/validate-manifests.sh
'''

# Transitional baseline entrypoints removed with the static mode in stack step 5.
[tasks."k8s:up"]
run = "bash scripts/k8s-up.sh"
[tasks."k8s:down"]
run = "bash scripts/k8s-down.sh"
[tasks."api:forward"]
run = '''
bash -euo pipefail -c '
source scripts/kind-common.sh
assert_context
exec kubectl --kubeconfig "$KUBECONFIG" --context "$CONTEXT" -n temporal-demo-orchestrator port-forward --address 127.0.0.1 service/orchestrator "${API_FORWARD_PORT:-18080}:8080"
'
'''
[tasks."ui:forward"]
run = '''
bash -euo pipefail -c '
source scripts/kind-common.sh
assert_context
exec kubectl --kubeconfig "$KUBECONFIG" --context "$CONTEXT" -n temporal port-forward --address 127.0.0.1 service/temporal-ui "${UI_FORWARD_PORT:-18088}:8080"
'
'''
