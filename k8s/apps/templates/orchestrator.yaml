apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: temporal-demo-orchestrator
spec:
  selector: {app: orchestrator}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: temporal-demo-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels: {app: orchestrator}
  template:
    metadata:
      labels: {app: orchestrator}
      annotations:
        checksum/registry: {{ include (print $.Template.BasePath "/static-registry.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: orchestrator
          image: "{{ .Values.images.orchestrator }}:{{ .Values.images.tag }}"
          imagePullPolicy: Never
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: TEMPORAL_ADDRESS, value: {{ .Values.temporalAddress | quote }}}
            - {name: TEMPORAL_NAMESPACE, value: default}
            - {name: TASK_QUEUE, value: orchestrator.v1.temporal}
            - {name: REGISTRY_MODE, value: static}
            - {name: REGISTRY_FILE, value: /etc/demo/workers.json}
            - {name: HTTP_ADDR, value: ':8080'}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
          volumeMounts: [{name: registry, mountPath: /etc/demo, readOnly: true}]
      volumes: [{name: registry, configMap: {name: static-registry}}]
