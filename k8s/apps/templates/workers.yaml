{{- range .Values.workers }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: temporal-demo-{{ .name }}
  annotations:
    temporal-worker: "true"
    temporal-worker-run-after: {{ .runAfter | quote }}
spec:
  selector: {app: {{ .name }}}
  ports: [{name: health, port: 8081, targetPort: health}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: temporal-demo-{{ .name }}
spec:
  replicas: {{ $.Values.replicas }}
  selector:
    matchLabels: {app: {{ .name }}}
  template:
    metadata:
      labels: {app: {{ .name }}}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: "{{ $.Values.images.worker }}:{{ $.Values.images.tag }}"
          imagePullPolicy: Never
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: health, containerPort: 8081}]
          env:
            - {name: TEMPORAL_ADDRESS, value: {{ $.Values.temporalAddress | quote }}}
            - {name: TEMPORAL_NAMESPACE, value: default}
            - {name: WORKER_NAME, value: {{ .name | quote }}}
            - {name: TASK_QUEUE, value: {{ printf "%s.v1.temporal" .name | quote }}}
            - {name: HTTP_ADDR, value: ':8081'}
            - {name: ACTIVITY_DURATION, value: 5s}
          readinessProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: health}, periodSeconds: 10}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
{{- end }}
