apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: temporal
spec:
  selector: {app: temporal}
  ports: [{name: grpc, port: 7233, targetPort: 7233}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: temporal
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: temporal}
  template:
    metadata:
      labels: {app: temporal}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
        - name: temporal
          image: temporalio/server:1.32.0@sha256:c3e752127759616bb1615e0f9ba0e21635aeb5fdeb922de4f371c350955f46ae
          env:
            - {name: TEMPORAL_SERVER_CONFIG_FILE_PATH, value: /etc/temporal/demo/config.yaml}
            - {name: TEMPORAL_ALLOW_NO_AUTH, value: 'true'}
            - name: BIND_ON_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}
          ports: [{name: grpc, containerPort: 7233}]
          readinessProbe: {tcpSocket: {port: grpc}, periodSeconds: 3}
          livenessProbe: {tcpSocket: {port: grpc}, initialDelaySeconds: 60, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '2', memory: 768Mi}}
          volumeMounts: [{name: config, mountPath: /etc/temporal/demo, readOnly: true}]
      volumes: [{name: config, configMap: {name: temporal-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: temporal
spec:
  selector: {app: temporal-ui}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: temporal
spec:
  replicas: 1
  selector:
    matchLabels: {app: temporal-ui}
  template:
    metadata:
      labels: {app: temporal-ui}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: ui
          image: temporalio/ui:2.48.0@sha256:5bc8712de27029b64a9cad156221b082a43ae27bfb108fc1743076eaabf1437f
          env:
            - {name: TEMPORAL_ADDRESS, value: temporal.temporal.svc.cluster.local:7233}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
