apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: api-validation-control
  namespace: temporal-demo-worker-a
spec:
  scaleTargetRef:
    name: worker-a
  maxReplicaCount: 1
  triggers:
    - type: temporal
      metadata:
        endpoint: temporal.temporal.svc.cluster.local:7233
        namespace: default
        taskQueue: worker-a.v1.temporal
        queueTypes: workflow,activity
        targetQueueSize: '1'
        activationTargetQueueSize: '0'
