apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-validation-control
  namespace: temporal-demo-worker-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-validation-control
  template:
    metadata:
      labels:
        app: api-validation-control
    spec:
      containers:
        - name: control
          image: registry.k8s.io/pause:3.10
