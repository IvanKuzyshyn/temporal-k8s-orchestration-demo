{{- if eq .Values.registry.mode "kubernetes" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: temporal-demo-orchestrator
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: temporal-demo-registry
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: temporal-demo-registry
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: temporal-demo-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: temporal-demo-registry
{{- range .Values.workers }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: temporal-demo-registry
  namespace: temporal-demo-{{ .name }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: temporal-demo-registry
  namespace: temporal-demo-{{ .name }}
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: temporal-demo-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: temporal-demo-registry
{{- end }}
{{- end }}
