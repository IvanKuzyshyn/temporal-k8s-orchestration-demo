images:
  orchestrator: temporal-demo/orchestrator
  worker: temporal-demo/worker
  tag: render-only
registry:
  namespaceSelector: temporal-demo.io/worker-namespace=true
scaling:
  bootstrapZero: false
  pollingInterval: 5
  cooldownPeriod: 120
temporalAddress: temporal.temporal.svc.cluster.local:7233
workers:
  - name: worker-a
    runAfter: ""
  - name: worker-b
    runAfter: worker-a
  - name: worker-c
    runAfter: worker-a
  - name: worker-d
    runAfter: worker-b,worker-c
