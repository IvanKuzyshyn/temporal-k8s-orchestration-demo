apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: temporal-validate-workers
  labels:
    app.kubernetes.io/part-of: temporal-worker-discovery
spec:
  evaluation:
    background:
      enabled: true
  validationActions:
    - Deny
  matchConstraints:
    namespaceSelector:
      matchLabels:
        temporal-demo.io/worker-namespace: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
  variables:
    - name: annotations
      expression: object.metadata.?annotations.orValue({})
    - name: dependencies
      expression: variables.annotations[?'temporal-worker-run-after'].orValue('')
    - name: tokens
      expression: variables.dependencies.split(',').map(token, token.trim())
  validations:
    - expression: >-
        !('temporal-worker' in variables.annotations) ||
        variables.annotations['temporal-worker'] in ['true', 'false']
      message: temporal-worker must be the string true or false when present.
    - expression: >-
        variables.annotations[?'temporal-worker'].orValue('') != 'true' ||
        variables.dependencies.trim() == '' ||
        variables.tokens.all(token,
          token.matches('^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$') &&
          token != object.metadata.name)
      message: Dependencies must be comma-separated Service names, with no empty entries or self-reference.
