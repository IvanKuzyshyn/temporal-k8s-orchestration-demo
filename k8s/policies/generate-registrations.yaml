apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: temporal-generate-registrations
  labels:
    app.kubernetes.io/part-of: temporal-worker-discovery
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
    orphanDownstreamOnPolicyDelete:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        temporal-demo.io/worker-namespace: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
  matchConditions:
    - name: worker-service
      expression: object.metadata.?annotations[?'temporal-worker'].orValue('') == 'true'
  variables:
    - name: registration
      expression: >-
        {
          'apiVersion': dyn('v1'),
          'kind': dyn('ConfigMap'),
          'metadata': dyn({
            'name': 'temporal-worker-' + object.metadata.name,
            'namespace': object.metadata.namespace,
            'labels': {'temporal-demo.io/registration': 'true'}
          }),
          'data': dyn({
            'schemaVersion': '1',
            'workerName': object.metadata.name,
            'taskQueue': object.metadata.name + '.v1.temporal',
            'workflowType': 'ExampleChildWorkflow',
            'runAfter': object.metadata.?annotations[?'temporal-worker-run-after'].orValue(''),
            'sourceServiceName': object.metadata.name,
            'sourceServiceNamespace': object.metadata.namespace,
            'sourceServiceUID': object.metadata.uid
          })
        }
  generate:
    - expression: generator.apply(object.metadata.namespace, [variables.registration])
